# Gerado na subida por docker-entrypoint.d/40-runtime-config.sh (API_UPSTREAM, padrão api:8080).
include /tmp/payments-upstream.conf;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O painel só fala com a API de operação; o prefixo /api é preservado.
  location /api/ {
    proxy_pass http://payments_api;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    client_max_body_size 6m;
  }

  # Gerado na subida por docker-entrypoint.d/40-runtime-config.sh (OIDC_AUTHORITY, OIDC_CLIENT_ID).
  location = /config.json {
    alias /tmp/config.json;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }
}
