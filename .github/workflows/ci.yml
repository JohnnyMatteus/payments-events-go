name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1

  web:
    name: Painel (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Testes de integração (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -tags integration
        run: |
          set -o pipefail
          go test -tags integration -count=1 -p 1 -timeout 15m ./... 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: Anotações da falha de integração
        if: failure()
        run: |
          log="$RUNNER_TEMP/integration.log"
          [ -f "$log" ] || exit 0
          annotate() {
            local msg
            msg="$(head -c 3500)"
            [ -n "$msg" ] || return 0
            msg="$(printf '%s' "$msg" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=integration::$1 $msg"
          }
          grep -nE '^(--- FAIL|FAIL|panic|=== RUN.*FAIL)|setup failed|_test\.go:[0-9]+|Error|timed out' "$log" | head -n 40 | annotate "[falhas]"
          grep -nE '^(ok|FAIL|\?)[[:space:]]' "$log" | head -n 20 | annotate "[pacotes]"
          tail -n 25 "$log" | annotate "[fim da saída]"

  build:
    name: Build e imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o bin/payments ./cmd/payments
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: docker build
        run: docker build --build-arg VERSION=${{ github.sha }} -t payments-events-go:ci .
      - name: docker compose config
        run: docker compose --profile core --profile observability --profile tools config --quiet
      - name: helm lint (rascunho do chart)
        run: docker run --rm -v "$PWD:/chart" -w /chart alpine/helm:3.17.0 lint deploy/helm/payments-events-go
