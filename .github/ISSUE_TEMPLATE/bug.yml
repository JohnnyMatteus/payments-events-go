name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado. Não cole segredos nem dados reais.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. make up && make seed
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options: [webhook/api, relay/outbox, consumidor, conciliação, infraestrutura local, CI]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou trace_id
      render: shell
