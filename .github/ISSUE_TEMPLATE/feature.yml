name: Melhoria
description: Proponha uma funcionalidade ou mudança de design
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que dor do lojista ou da operação isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: adr
    attributes:
      label: Decisão de arquitetura
      options:
        - label: Esta mudança precisa de um ADR novo ou atualizado
