global:
  scrape_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: payments-api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: payments-relay
    static_configs: [{targets: ["relay:9090"]}]
  - job_name: payments-consumer
    static_configs: [{targets: ["consumer:9090"]}]
  - job_name: payments-watcher
    static_configs: [{targets: ["watcher:9090"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
  # Métrica por fila (profundidade da DLQ): o /metrics agregado não a traz.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{targets: ["rabbitmq:15692"]}]
