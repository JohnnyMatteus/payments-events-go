{{- $root := . -}}
{{- range $name, $port := dict "api" 8080 "relay" 9090 "consumer" 9090 }}
{{- $cfg := index $root.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payments.fullname" $root }}-{{ $name }}
  labels:
    {{- include "payments.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "payments.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $port | quote }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "payments.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: [{{ $name | quote }}]
          ports:
            - name: http
              containerPort: {{ $port }}
          {{- include "payments.env" $root | nindent 10 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- include "payments.securityContext" $root | nindent 10 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "payments.fullname" . }}-api
  labels:
    {{- include "payments.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
