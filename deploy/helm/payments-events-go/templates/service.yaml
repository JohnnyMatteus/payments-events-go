apiVersion: v1
kind: Service
metadata:
  name: {{ include "payments.fullname" . }}-api
  labels:
    {{- include "payments.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if .Values.grpc.enabled }}
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
    {{- end }}
