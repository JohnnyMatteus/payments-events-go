{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payments.fullname" . }}-api
  labels:
    {{- include "payments.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- if .Values.web.enabled }}
        # O painel do próprio release sempre pode chamar a API, mesmo com ingressFrom restrito.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
        {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
        {{- if .Values.grpc.enabled }}
        - port: {{ .Values.grpc.port }}
          protocol: TCP
        {{- end }}
{{- end }}
