{{- if .Values.reconcile.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "payments.fullname" . }}-reconcile
  labels:
    {{- include "payments.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconcile
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "payments.labels" . | nindent 12 }}
            app.kubernetes.io/component: reconcile
        spec:
          restartPolicy: Never
          {{- include "payments.podCommon" . | nindent 10 }}
          containers:
            - name: reconcile
              image: {{ include "payments.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # -daily concilia o dia anterior (UTC) pelo mesmo executor do painel; código 3 = divergência.
              args: ["reconcile", "-daily", "-fail-on-divergence"]
              {{- include "payments.env" . | nindent 14 }}
              {{- include "payments.securityContext" . | nindent 14 }}
{{- end }}
