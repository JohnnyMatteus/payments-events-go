version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Testes podem usar requisições sem contexto e caminhos montados no teste.
      - path: _test\.go
        linters:
          - noctx
          - gosec
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JohnnyMatteus/payments-events-go
