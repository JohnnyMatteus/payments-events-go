# Ambiente local do payments-events-go.
#
# Profiles:
#   core           banco, broker, Redis, S3 emulado (LocalStack) e os processos do serviço
#   observability  Jaeger (traces) e Prometheus (métricas)
#   tools          job de conciliação sob demanda
#
# Use o Makefile: `make up`, `make up-observability`, `make reconcile`.
# Senhas e chaves abaixo são exclusivamente de desenvolvimento.
name: payments-events-go

x-app: &app
  build:
    context: .
    args:
      VERSION: ${APP_VERSION:-dev}
  image: payments-events-go:${APP_VERSION:-dev}
  networks: [payments-net]
  restart: unless-stopped
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://payments:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/payments?sslmode=disable
    RABBITMQ_URL: amqp://payments:${RABBITMQ_PASSWORD:-dev-only-change-me}@rabbitmq:5672/
    WEBHOOK_SECRETS: ${WEBHOOK_SECRETS:-whsec_dev_only_change_me}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    S3_ENDPOINT: http://localstack:4566
    S3_USE_PATH_STYLE: "true"
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

services:
  postgres:
    image: postgres:17.6-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports: ["${POSTGRES_PORT:-5434}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [payments-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-change-me}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_UI_PORT:-15673}:15672"
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [payments-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  # Atalho de idempotência e limite por lojista do webhook. Sem persistência
  # em disco de propósito: perder o Redis só manda as requisições ao Postgres.
  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports: ["${REDIS_PORT:-6381}:6379"]
    volumes: [redis-data:/data]
    networks: [payments-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 192M}

  # S3 emulado: o provedor deposita o extrato de liquidação no bucket
  # pagafacil-statements (criado por init/aws/01-statements-bucket.sh).
  localstack:
    image: localstack/localstack:4.5.0
    profiles: [core]
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ["${LOCALSTACK_PORT:-4567}:4566"]
    volumes:
      - ./init/aws:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    networks: [payments-net]
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket pagafacil-statements"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1", memory: 768M}

  migrate:
    <<: *app
    profiles: [core]
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    profiles: [core]
    command: ["api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      OTEL_SERVICE_NAME: payments-api
      REDIS_URL: redis://redis:6379/0
      # Baixo de propósito no ambiente local, para o limite ser visível na demo.
      WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-20}
      WEBHOOK_RATE_WINDOW: ${WEBHOOK_RATE_WINDOW:-1m}
    ports: ["${API_PORT:-8085}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/payments", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  relay:
    <<: *app
    profiles: [core]
    command: ["relay"]
    environment:
      <<: *app-env
      OPS_ADDR: ":9090"
    ports: ["${RELAY_OPS_PORT:-9101}:9090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/payments", "healthcheck", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer:
    <<: *app
    profiles: [core]
    command: ["consumer"]
    environment:
      <<: *app-env
      OPS_ADDR: ":9090"
    ports: ["${CONSUMER_OPS_PORT:-9102}:9090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/payments", "healthcheck", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Job de conciliação: `make reconcile DATE=2026-11-20`.
  reconcile:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: ["reconcile", "-statement", "s3://pagafacil-statements/settlements/${RECONCILE_DATE:-2026-11-20}.csv",
              "-from", "${RECONCILE_DATE:-2026-11-20}"]
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports: ["${JAEGER_UI_PORT:-16687}:16686"]
    networks: [payments-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["${PROMETHEUS_PORT:-9095}:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [payments-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: payments-events-postgres-data
  rabbitmq-data:
    name: payments-events-rabbitmq-data
  localstack-data:
    name: payments-events-localstack-data
  prometheus-data:
    name: payments-events-prometheus-data
  redis-data:
    name: payments-events-redis-data

networks:
  payments-net:
    name: payments-events-net
