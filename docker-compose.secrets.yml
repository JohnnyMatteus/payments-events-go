# Override: a API lê o segredo do webhook e a senha do banco do Secrets Manager
# (LocalStack), em vez das variáveis de ambiente (ADR 0014). `make up-secrets`.
# Valores seedados por init/aws/02-secrets.sh (dev-only). Não foi exercitado
# contra o Secrets Manager da AWS.
x-secrets: &secrets
  SECRETS_PROVIDER: awssm
  SECRETS_ENDPOINT: http://localstack:4566
  SECRETS_REFRESH_INTERVAL: 30s
  WEBHOOK_SECRETS: ""
  WEBHOOK_SECRETS_REF: payments/webhook
  DATABASE_PASSWORD_REF: payments/db#password

services:
  api:
    environment: *secrets
  relay:
    environment: *secrets
  consumer:
    environment: *secrets
  watcher:
    environment: *secrets
